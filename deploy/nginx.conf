# Docker's DNS returns one address per api replica; re-resolve every 5s so scaling is picked up.
resolver 127.0.0.11 valid=5s;

upstream api_pool {
    zone api_pool 64k;
    server api:8000 resolve;
}

server {
    listen 80;
    client_max_body_size 50m;
    location / {
        proxy_pass http://api_pool;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
}
